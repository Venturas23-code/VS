name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite then package app
        run: |
          npm run build
          npm run make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
            name: build-${{ matrix.os }}
            path: |
                out/**/*.exe
                out/**/*.deb
                out/**/*.rpm
                out/**/*.zip
                out/**/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
            body: |
                ## Downloads

                ### Windows
                - Installer: `VS Setup.exe`
                - Portable: `.zip`

                ### Linux
                - Portable: `.zip`
                - Debian: `.deb`
                - RPM: `.rpm`

                ### macOS
                - Portable: `.zip`
            files: |
                release-files/**/*Setup.exe
                release-files/**/*.zip
                release-files/**/*.deb
                release-files/**/*.rpm
                release-files/**/*.AppImage
                release-files/**/*.nupkg
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}